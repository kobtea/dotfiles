# Cheat Sheet
# -----------
# prefix : C-z
#
# --- session ---
# new session    : tmux new -s <name>
# detach         : prefix + d
# list sessions  : tmux ls
# attach         : tmux a -t <name>
#
# --- window ---
# new window     : prefix + c
# next / prev    : prefix + n / p
# reorder        : prefix + < / >
# close          : prefix + &
#
# --- pane ---
# split vertical   : prefix + |  (full: \\)
# split horizontal : prefix + -  (full: _)
# navigate         : prefix + h/j/k/l
# resize           : prefix + H/J/K/L
# close            : prefix + x
#
# --- copy mode (vi) ---
# enter   : prefix + [
# select  : v
# copy    : y  (copies to clipboard)
# paste   : prefix + ]
#
# --- misc ---
# reload config  : prefix + R
# capture pane   : tmux capture-pane -pS - > log.txt
#
# ============================================================

# options
# -------
set -g aggressive-resize on   # マルチモニター時のリサイズ最適化
set -g default-shell "$SHELL"
set -g display-time 4000      # メッセージ表示時間(ms)
set -s escape-time 0          # vim のモード切替遅延をなくす
set -g focus-events on        # フォーカスイベント有効化
set -g history-limit 50000    # スクロールバック行数
set -wg mode-keys vi
set -g monitor-activity on
set -g mouse on
set -g prefix C-z
set -g status-interval 5      # ステータス更新間隔(秒)
set -g status-keys emacs      # コマンドプロンプトのキーバインド

# status line
# -----------
set -g default-terminal "tmux-256color"
set -wg window-status-current-style 'fg=black,bg=blue'
set -g status-right "#(uptime | cut -d':' -f4-) | %Y-%m-%d(%a) %H:%M #[default]"

# key bindings
# ------------
bind-key C-z send-prefix  # 多段tmux等でもbind-keyを継承させる
unbind-key C-b
bind R source-file ~/.tmux.conf \; display "reloaded!"

# splits (カレントパスを引き継ぐ)
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -fh -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -fv -c "#{pane_current_path}"

# pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# window reorder
bind < swap-window -t -1 \; previous-window
bind > swap-window -t +1 \; next-window

# new window in current path
bind c new-window -c "#{pane_current_path}"

# copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# mouse selection: keep visible on drag end (copy with Cmd+C in iTerm2)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X stop-selection
